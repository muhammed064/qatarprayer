<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Times - Qatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a5fb4, #26a269);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(to right, #1a5fb4, #26a269);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        
        .date-display {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .controls {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            background-color: #f8f8f8;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }
        
        select, button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background-color: white;
            cursor: pointer;
            min-width: 120px;
        }
        
        button {
            background: linear-gradient(to right, #1a5fb4, #26a269);
            color: white;
            border: none;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .api-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: #f0f7ff;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .api-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #1a5fb4;
            color: #1a5fb4;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .api-btn.active {
            background: #1a5fb4;
            color: white;
        }
        
        .countdown-container {
            margin: 20px 25px;
            padding: 20px;
            background: linear-gradient(135deg, #1a5fb4, #26a269);
            color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .countdown-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .countdown-timer {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            font-family: 'Courier New', monospace;
        }
        
        .countdown-label {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .prayer-times {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 25px;
        }
        
        .prayer-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s;
            border: 2px solid transparent;
        }
        
        .prayer-card:hover {
            transform: translateY(-5px);
        }
        
        .prayer-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a5fb4;
            margin-bottom: 10px;
        }
        
        .prayer-time {
            font-size: 1.5rem;
            font-weight: 700;
            color: #26a269;
        }
        
        .current-prayer {
            background: linear-gradient(to right, #1a5fb4, #26a269);
            color: white;
            border-color: #1a5fb4;
        }
        
        .current-prayer .prayer-name {
            color: white;
        }
        
        .current-prayer .prayer-time {
            color: white;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #e0e0e0;
            background-color: #f8f8f8;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #666;
        }
        
        .error {
            text-align: center;
            padding: 20px;
            color: #d33636;
            background-color: #ffe6e6;
            margin: 20px;
            border-radius: 8px;
            border-left: 4px solid #d33636;
        }
        
        .data-source {
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
            color: #666;
        }
        
        @media (max-width: 600px) {
            .prayer-times {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .api-selector {
                flex-direction: column;
                align-items: center;
            }
            
            select, button {
                width: 100%;
                max-width: 200px;
            }
            
            .countdown-timer {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Prayer Times - Qatar</h1>
            <div class="date-display" id="current-date">Loading...</div>
        </header>
        
        <div class="api-selector">
            <button class="api-btn active" data-api="aladhan">Aladhan API</button>
            <button class="api-btn" data-api="islamicfinder">Islamic Finder</button>
            <button class="api-btn" data-api="prayertimes">PrayerTimes API</button>
        </div>
        
        <div class="controls">
            <select id="city-select">
                <option value="doha">Doha</option>
                <option value="al-wakrah">Al Wakrah</option>
                <option value="al-khor">Al Khor</option>
                <option value="al-rayyan">Al Rayyan</option>
            </select>
            <select id="method-select">
                <option value="4">Umm Al-Qura, Makkah</option>
                <option value="1">University of Islamic Sciences, Karachi</option>
                <option value="2">Islamic Society of North America</option>
                <option value="3">Muslim World League</option>
                <option value="5">Egyptian General Authority of Survey</option>
            </select>
            <button id="refresh-btn">Refresh Times</button>
        </div>
        
        <div class="data-source" id="data-source">
            Loading prayer times...
        </div>
        
        <!-- Countdown Timer -->
        <div class="countdown-container">
            <div class="countdown-title">Time until <span id="next-prayer-name">Next Prayer</span></div>
            <div class="countdown-timer" id="countdown-timer">--:--:--</div>
            <div class="countdown-label">at <span id="next-prayer-time">--:--</span></div>
        </div>
        
        <div class="prayer-times" id="prayer-times-container">
            <div class="loading">Loading prayer times...</div>
        </div>
        
        <footer>
            <p>Accurate prayer times from reliable Islamic sources</p>
            <p id="calculation-method">Calculation method: Loading...</p>
        </footer>
    </div>

    <script>
        // DOM Elements
        const currentDateElement = document.getElementById('current-date');
        const prayerTimesContainer = document.getElementById('prayer-times-container');
        const countdownTimerElement = document.getElementById('countdown-timer');
        const nextPrayerNameElement = document.getElementById('next-prayer-name');
        const nextPrayerTimeElement = document.getElementById('next-prayer-time');
        const citySelect = document.getElementById('city-select');
        const methodSelect = document.getElementById('method-select');
        const refreshButton = document.getElementById('refresh-btn');
        const dataSourceElement = document.getElementById('data-source');
        const calculationMethodElement = document.getElementById('calculation-method');
        const apiButtons = document.querySelectorAll('.api-btn');

        // Configuration
        let currentAPI = 'aladhan';
        let countdownInterval;
        
        // Qatar city coordinates
        const cityCoordinates = {
            'doha': { lat: 25.2854, lng: 51.5310, name: 'Doha' },
            'al-wakrah': { lat: 25.1715, lng: 51.6034, name: 'Al Wakrah' },
            'al-khor': { lat: 25.6804, lng: 51.4969, name: 'Al Khor' },
            'al-rayyan': { lat: 25.2919, lng: 51.4244, name: 'Al Rayyan' }
        };

        // Calculation method names
        const methodNames = {
            '1': 'University of Islamic Sciences, Karachi',
            '2': 'Islamic Society of North America',
            '3': 'Muslim World League',
            '4': 'Umm Al-Qura University, Makkah',
            '5': 'Egyptian General Authority of Survey'
        };

        // Update current date
        function updateCurrentDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            currentDateElement.textContent = now.toLocaleDateString('en-US', options);
            return now;
        }
        
        // Fetch from Aladhan API (very reliable)
        async function fetchFromAladhan(city = 'doha', method = '4') {
            const coords = cityCoordinates[city];
            const now = new Date();
            const date = `${now.getDate()}-${now.getMonth() + 1}-${now.getFullYear()}`;
            
            const url = `https://api.aladhan.com/v1/timings/${date}?latitude=${coords.lat}&longitude=${coords.lng}&method=${method}&school=0`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (data.code === 200) {
                    return {
                        times: data.data.timings,
                        method: methodNames[method] || 'Unknown Method',
                        date: data.data.date.readable
                    };
                } else {
                    throw new Error('API returned error');
                }
            } catch (error) {
                throw new Error(`Aladhan API: ${error.message}`);
            }
        }
        
        // Fetch from Islamic Finder API
        async function fetchFromIslamicFinder(city = 'doha') {
            const coords = cityCoordinates[city];
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            
            // Using a CORS proxy to avoid CORS issues
            const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
            const targetUrl = `http://www.islamicfinder.us/index.php/api/prayer_times?latitude=${coords.lat}&longitude=${coords.lng}&year=${year}&month=${month}&day=${day}`;
            
            try {
                const response = await fetch(proxyUrl + targetUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    return {
                        times: {
                            Fajr: data.results.Fajr,
                            Sunrise: data.results.Sunrise,
                            Dhuhr: data.results.Dhuhr,
                            Asr: data.results.Asr,
                            Maghrib: data.results.Maghrib,
                            Isha: data.results.Isha
                        },
                        method: 'Islamic Finder Calculation',
                        date: `${day}/${month}/${year}`
                    };
                } else {
                    throw new Error('API returned error');
                }
            } catch (error) {
                throw new Error(`Islamic Finder: ${error.message}`);
            }
        }
        
        // Fetch from PrayerTimes API
        async function fetchFromPrayerTimes(city = 'doha') {
            const coords = cityCoordinates[city];
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            
            // Using a CORS proxy to avoid CORS issues
            const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
            const targetUrl = `http://api.pray.zone/v2/times/today.json?city=doha&school=0`;
            
            try {
                const response = await fetch(proxyUrl + targetUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (data.code === 200) {
                    const today = data.results.datetime[0].times;
                    return {
                        times: {
                            Fajr: today.Fajr,
                            Sunrise: today.Sunrise,
                            Dhuhr: today.Dhuhr,
                            Asr: today.Asr,
                            Maghrib: today.Maghrib,
                            Isha: today.Isha
                        },
                        method: 'PrayerTimes.org',
                        date: data.results.datetime[0].date.gregorian
                    };
                } else {
                    throw new Error('API returned error');
                }
            } catch (error) {
                throw new Error(`PrayerTimes API: ${error.message}`);
            }
        }
        
        // Main function to get prayer times
        async function getPrayerTimes(city = 'doha', method = '4') {
            try {
                prayerTimesContainer.innerHTML = '<div class="loading">Loading prayer times...</div>';
                refreshButton.disabled = true;
                
                let data;
                
                switch (currentAPI) {
                    case 'aladhan':
                        dataSourceElement.textContent = 'Fetching from Aladhan API...';
                        data = await fetchFromAladhan(city, method);
                        break;
                    case 'islamicfinder':
                        dataSourceElement.textContent = 'Fetching from Islamic Finder...';
                        data = await fetchFromIslamicFinder(city);
                        break;
                    case 'prayertimes':
                        dataSourceElement.textContent = 'Fetching from PrayerTimes API...';
                        data = await fetchFromPrayerTimes(city);
                        break;
                    default:
                        throw new Error('Unknown API selected');
                }
                
                dataSourceElement.innerHTML = `<span style="color: #26a269;">✓ Live data from ${currentAPI}</span>`;
                calculationMethodElement.textContent = `Calculation method: ${data.method}`;
                
                return data;
                
            } catch (error) {
                console.error('Error fetching prayer times:', error);
                
                // Try fallback to another API
                dataSourceElement.innerHTML = `<span style="color: #d33636;">✗ ${error.message}. Trying alternative...</span>`;
                
                // Cycle through APIs until one works
                const apis = ['aladhan', 'islamicfinder', 'prayertimes'];
                const currentIndex = apis.indexOf(currentAPI);
                const nextAPI = apis[(currentIndex + 1) % apis.length];
                
                if (nextAPI !== currentAPI) {
                    currentAPI = nextAPI;
                    // Update active button
                    apiButtons.forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.api === currentAPI);
                    });
                    return await getPrayerTimes(city, method);
                }
                
                throw new Error('All APIs failed. Please check your connection.');
            } finally {
                refreshButton.disabled = false;
            }
        }
        
        // Display prayer times
        function displayPrayerTimes(prayerData) {
            if (!prayerData || !prayerData.times) {
                prayerTimesContainer.innerHTML = '<div class="error">No prayer data available</div>';
                return;
            }
            
            const prayers = [
                { name: 'Fajr', key: 'Fajr' },
                { name: 'Sunrise', key: 'Sunrise' },
                { name: 'Dhuhr', key: 'Dhuhr' },
                { name: 'Asr', key: 'Asr' },
                { name: 'Maghrib', key: 'Maghrib' },
                { name: 'Isha', key: 'Isha' }
            ];
            
            let html = '';
            prayers.forEach(prayer => {
                const time = prayerData.times[prayer.key];
                if (time) {
                    html += `
                        <div class="prayer-card" id="${prayer.key}-card">
                            <div class="prayer-name">${prayer.name}</div>
                            <div class="prayer-time">${formatTime(time)}</div>
                        </div>
                    `;
                }
            });
            
            prayerTimesContainer.innerHTML = html;
            
            // Highlight current prayer and start countdown
            highlightCurrentPrayer(prayerData.times, prayers);
        }
        
        // Format time from "HH:MM" to 12-hour format
        function formatTime(timeString) {
            if (!timeString) return '--:--';
            
            // Handle different time formats (04:30 or 0430)
            let hours, minutes;
            if (timeString.includes(':')) {
                [hours, minutes] = timeString.split(':').map(Number);
            } else if (timeString.length === 4) {
                hours = parseInt(timeString.substring(0, 2));
                minutes = parseInt(timeString.substring(2, 4));
            } else {
                return timeString;
            }
            
            const period = hours >= 12 ? 'PM' : 'AM';
            const twelveHour = hours % 12 || 12;
            
            return `${twelveHour}:${minutes.toString().padStart(2, '0')} ${period}`;
        }
        
        // Convert time string to minutes
        function timeToMinutes(timeString) {
            if (!timeString) return 0;
            
            let hours, minutes;
            if (timeString.includes(':')) {
                [hours, minutes] = timeString.split(':').map(Number);
            } else if (timeString.length === 4) {
                hours = parseInt(timeString.substring(0, 2));
                minutes = parseInt(timeString.substring(2, 4));
            } else {
                return 0;
            }
            
            return hours * 60 + minutes;
        }
        
        // Highlight current prayer based on current time
        function highlightCurrentPrayer(prayers, prayerOrder) {
            const now = new Date();
            const currentTime = now.getHours() * 60 + now.getMinutes();
            
            // Convert prayer times to minutes for comparison
            const prayerMinutes = prayerOrder.map(prayer => {
                return {
                    ...prayer,
                    minutes: timeToMinutes(prayers[prayer.key])
                };
            }).filter(p => p.minutes > 0);
            
            if (prayerMinutes.length === 0) return;
            
            // Find current prayer
            let currentPrayer = null;
            let nextPrayer = null;
            
            for (let i = 0; i < prayerMinutes.length - 1; i++) {
                if (currentTime >= prayerMinutes[i].minutes && currentTime < prayerMinutes[i + 1].minutes) {
                    currentPrayer = prayerMinutes[i];
                    nextPrayer = prayerMinutes[i + 1];
                    break;
                }
            }
            
            // If after Isha or before Fajr
            if (!currentPrayer) {
                if (currentTime >= prayerMinutes[prayerMinutes.length - 1].minutes || 
                    currentTime < prayerMinutes[0].minutes) {
                    currentPrayer = prayerMinutes[prayerMinutes.length - 1];
                    nextPrayer = prayerMinutes[0];
                }
            }
            
            // If we still don't have a next prayer, default to the first one
            if (!nextPrayer && prayerMinutes.length > 0) {
                nextPrayer = prayerMinutes[0];
            }
            
            // Update UI
            updatePrayerCards(prayerMinutes, currentPrayer);
            startCountdown(nextPrayer, prayers);
        }
        
        // Update prayer cards styling
        function updatePrayerCards(prayerMinutes, currentPrayer) {
            prayerMinutes.forEach(prayer => {
                const card = document.getElementById(`${prayer.key}-card`);
                if (card) {
                    card.classList.remove('current-prayer');
                    if (currentPrayer && prayer.key === currentPrayer.key) {
                        card.classList.add('current-prayer');
                    }
                }
            });
        }
        
        // Start countdown for next prayer
        function startCountdown(nextPrayer, prayers) {
            if (!nextPrayer) return;
            
            // Clear any existing countdown
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            // Update next prayer info
            nextPrayerNameElement.textContent = nextPrayer.name;
            nextPrayerTimeElement.textContent = formatTime(prayers[nextPrayer.key]);
            
            // Update countdown immediately
            updateCountdown(nextPrayer, prayers);
            
            // Update countdown every second
            countdownInterval = setInterval(() => {
                updateCountdown(nextPrayer, prayers);
            }, 1000);
        }
        
        // Update countdown display
        function updateCountdown(nextPrayer, prayers) {
            const now = new Date();
            const currentTime = now.getHours() * 60 * 60 + now.getMinutes() * 60 + now.getSeconds();
            
            // Convert next prayer time to seconds
            const nextPrayerTime = prayers[nextPrayer.key];
            let [hours, minutes] = nextPrayerTime.includes(':') ? 
                nextPrayerTime.split(':').map(Number) : 
                [parseInt(nextPrayerTime.substring(0, 2)), parseInt(nextPrayerTime.substring(2, 4))];
            
            const nextPrayerSeconds = hours * 60 * 60 + minutes * 60;
            
            // Calculate time difference
            let diffSeconds = nextPrayerSeconds - currentTime;
            
            // Handle case where next prayer is tomorrow
            if (diffSeconds < 0) {
                diffSeconds += 24 * 60 * 60; // Add 24 hours in seconds
            }
            
            // Format countdown display
            const hoursLeft = Math.floor(diffSeconds / 3600);
            const minutesLeft = Math.floor((diffSeconds % 3600) / 60);
            const secondsLeft = diffSeconds % 60;
            
            countdownTimerElement.textContent = 
                `${hoursLeft.toString().padStart(2, '0')}:${minutesLeft.toString().padStart(2, '0')}:${secondsLeft.toString().padStart(2, '0')}`;
            
            // If it's time for the next prayer, refresh the data
            if (diffSeconds <= 0) {
                refreshPrayerTimes();
            }
        }
        
        // Refresh prayer times
        async function refreshPrayerTimes() {
            const prayerData = await getPrayerTimes(citySelect.value, methodSelect.value);
            window.currentPrayerData = prayerData;
            displayPrayerTimes(prayerData);
        }
        
        // Initialize the application
        async function init() {
            updateCurrentDate();
            const prayerData = await getPrayerTimes(citySelect.value, methodSelect.value);
            window.currentPrayerData = prayerData;
            displayPrayerTimes(prayerData);
            
            // Update date every minute
            setInterval(updateCurrentDate, 60000);
        }
        
        // Event listeners
        citySelect.addEventListener('change', async () => {
            const prayerData = await getPrayerTimes(citySelect.value, methodSelect.value);
            window.currentPrayerData = prayerData;
            displayPrayerTimes(prayerData);
        });
        
        methodSelect.addEventListener('change', async () => {
            const prayerData = await getPrayerTimes(citySelect.value, methodSelect.value);
            window.currentPrayerData = prayerData;
            displayPrayerTimes(prayerData);
        });
        
        refreshButton.addEventListener('click', async () => {
            const prayerData = await getPrayerTimes(citySelect.value, methodSelect.value);
            window.currentPrayerData = prayerData;
            displayPrayerTimes(prayerData);
        });
        
        // API selector buttons
        apiButtons.forEach(btn => {
            btn.addEventListener('click', async () => {
                apiButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentAPI = btn.dataset.api;
                
                const prayerData = await getPrayerTimes(citySelect.value, methodSelect.value);
                window.currentPrayerData = prayerData;
                displayPrayerTimes(prayerData);
            });
        });
        
        // Start the application
        init();
    </script>
</body>
</html>
